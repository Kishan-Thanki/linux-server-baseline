name: Standardized CD Release Deployer

on:
  release:
    types: [published]
  workflow_dispatch:
  inputs:
    version_tag:
      description: "Version tag to deploy (e.g., service-v1.0.0)"
      required: true
      type: string

env:
  SERVICE_NAME: "placeholder-service"          # e.g., api-service
  SYSTEMD_SERVICE: "placeholder-service.service" # e.g., api-service.service
  HEALTH_URL: "http://placeholder:port/health"   # e.g., http://localhost:8080/health

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Deployment Version
        id: context
        run: |
          # Determine version tag from release event or manual input
          if [ "${{ github.event_name }}" == 'release' ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.version_tag }}"
          fi
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved production deployment version: $TAG"

      - name: Validate Production Safety Guardrail
        run: |
          TAG="${{ steps.context.outputs.VERSION }}"
          # Guardrail: Explicitly block any non-production tag from entering production
          if [[ "$TAG" == *-dev* ]] || [[ "$TAG" == *-test* ]] || [[ "$TAG" == *-stag* ]] || [[ "$TAG" == *-rc* ]]; then
            echo "ERROR: Attempted to deploy non-production tag ($TAG) to production!"
            exit 1
          fi
          echo "Production guardrail passed successfully. Clean production tag verified."

      - name: Download Pre-built Release Asset & Checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.context.outputs.VERSION }}"
          echo "Fetching immutable asset and checksum for version: $VERSION"

          # Download binary tarball and its sha256 checksum file generated in release
          gh release download "$VERSION" --pattern "*.tar.gz" --output artifact.tar.gz
          gh release download "$VERSION" --pattern "*.sha256" --output artifact.tar.gz.sha256 || true

          if [ ! -f "artifact.tar.gz" ]; then
            echo "Error: No .tar.gz artifact found attached to release $VERSION"
            exit 1
          fi

          # Extract or generate checksum value safely for deploy.sh consumption
          if [ -f "artifact.tar.gz.sha256" ]; then
            CHECKSUM=$(awk '{print $1}' artifact.tar.gz.sha256)
          else
            CHECKSUM=$(sha256sum artifact.tar.gz | awk '{print $1}')
          fi
          echo "SHA256_HASH=$CHECKSUM" >> $GITHUB_ENV

      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Securely Trust Remote Host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Artifact to Target Server
        run: |
          echo "Uploading verified artifact to remote host..."
          scp artifact.tar.gz deploy@${{ secrets.SSH_HOST }}:/home/deploy/artifact.tar.gz

      - name: Execute Server Deployment Engine
        env:
          VERSION: ${{ steps.context.outputs.VERSION }}
          CHECKSUM: ${{ env.SHA256_HASH }}
        run: |
          echo "Triggering remote deployment script via deploy user..."
          
          # Standard EOF (unquoted) so local env variables safely evaluate before transmission
          ssh deploy@${{ secrets.SSH_HOST }} << EOF
            set -e
            
            # Execute robust server-side deployment script complying with all safeguards
            /opt/platform/deploy.sh \
              --service "${{ env.SERVICE_NAME }}" \
              --version "$VERSION" \
              --artifact "/home/deploy/artifact.tar.gz" \
              --sha256 "$CHECKSUM" \
              --systemd "${{ env.SYSTEMD_SERVICE }}" \
              --health "${{ env.HEALTH_URL }}"
              
            # Cleanup remote staging file
            rm -f /home/deploy/artifact.tar.gz
          EOF

      - name: Cleanup Runner Artifacts
        if: always()
        run: |
          rm -f artifact.tar.gz artifact.tar.gz.sha256