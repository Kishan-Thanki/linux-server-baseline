# ============================================================================
# STANDARDIZED CD RELEASE DEPLOYER — BOILERPLATE TEMPLATE
# ============================================================================
#
# IMPORTANT:
# This workflow is a shared DevOps boilerplate/template.
#
# DO NOT change the core deployment flow, safety checks, artifact verification,
# SSH handling, checksum verification, or invocation of /opt/platform/deploy.sh
# unless the DevOps/platform team explicitly approves the change.
#
# This template is designed to be CONSUMED by individual application
# repositories. Each consuming repository is responsible for configuring the
# application-specific values required by this workflow.
#
# ---------------------------------------------------------------------------
# WHAT CONSUMING REPOSITORIES MUST CONFIGURE
# ---------------------------------------------------------------------------
#
# 1. SERVICE_NAME
#    The exact service identifier used by the server deployment platform.
#
#    Example:
#      SERVICE_NAME: "api"
#
# 2. SYSTEMD_SERVICE
#    The systemd unit that must be restarted after deployment.
#
#    Example:
#      SYSTEMD_SERVICE: "api.service"
#
# 3. HEALTH_URL
#    The production health endpoint used by deploy.sh after restart and during
#    rollback validation.
#
#    Example:
#      HEALTH_URL: "http://localhost:8080/health"
#
# 4. ARTIFACT_NAME
#    The exact release artifact produced by the application's artifact workflow.
#
#    Example:
#      ARTIFACT_NAME: "api-artifact.tar.gz"
#
# 5. CHECKSUM_NAME
#    The exact SHA256 checksum file produced alongside the release artifact.
#
#    Example:
#      CHECKSUM_NAME: "api-artifact.tar.gz.sha256"
#
# ---------------------------------------------------------------------------
# REQUIRED GITHUB SECRETS
# ---------------------------------------------------------------------------
#
# The consuming repository must provide the required deployment secrets.
#
# SSH_PRIVATE_KEY
#   Private SSH key used by GitHub Actions to authenticate to the deployment
#   server.
#
# SSH_HOST
#   Hostname or IP address of the production deployment server.
#
# Do NOT hard-code credentials, private keys, tokens, passwords, or other
# secrets in this workflow.
#
# ---------------------------------------------------------------------------
# RELEASE / TAG REQUIREMENTS
# ---------------------------------------------------------------------------
#
# This template provides generic production safety checks.
#
# The consuming repository MUST additionally enforce its own service-specific
# production tag format.
#
# Examples:
#
#   API:
#     api-v1.0.0
#
#   gRPC:
#     gRPC-v1.0.0
#
# The consuming repository should reject tags belonging to another service.
#
# ---------------------------------------------------------------------------
# ARTIFACT REQUIREMENTS
# ---------------------------------------------------------------------------
#
# The release artifact must already be built and published by the application's
# artifact workflow.
#
# The deployment workflow MUST NOT build application code on the deployment
# runner.
#
# The release must contain:
#
#   - the exact production artifact
#   - the corresponding SHA256 checksum file
#
# A missing checksum is a deployment failure.
#
# The checksum is verified before the artifact is sent to the production
# server, and deploy.sh performs its own checksum verification again on the
# server.
#
# ---------------------------------------------------------------------------
# SERVER-SIDE DEPLOYMENT
# ---------------------------------------------------------------------------
#
# This workflow delegates the actual deployment to the standardized platform
# deployment engine:
#
#   /opt/platform/deploy.sh
#
# Do NOT copy or replace deploy.sh inside the application repository.
#
# The platform deployment engine is responsible for release management,
# activation, systemd restart, health validation, rollback, locking, pruning,
# and deployment logging.
#
# ---------------------------------------------------------------------------
# APPLICATION-SPECIFIC CHANGES
# ---------------------------------------------------------------------------
#
# Application repositories MAY customize:
#
#   - service name
#   - systemd service name
#   - health endpoint
#   - artifact name
#   - checksum artifact name
#   - service-specific tag validation
#   - repository-specific GitHub secrets
#
# Application repositories SHOULD NOT modify the standardized deployment
# mechanism itself.
#
# If the deployment mechanism needs to change, update this shared template
# through the DevOps/platform process rather than making independent copies
# of the deployment logic.
#
# ============================================================================

name: Standardized CD Release Deployer

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to deploy (e.g., service-v1.0.0)"
        required: true
        type: string

env:
  SERVICE_NAME: "placeholder-service"
  SYSTEMD_SERVICE: "placeholder-service.service"
  HEALTH_URL: "http://localhost:8080/health"

  ARTIFACT_NAME: "artifact.tar.gz"
  CHECKSUM_NAME: "artifact.tar.gz.sha256"

jobs:
  deploy:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Resolve Deployment Version
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ -z "$TAG" ]]; then
            echo "ERROR: Deployment version tag is empty."
            exit 1
          fi

          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved production deployment version: $TAG"

      - name: Validate Production Release Tag
        env:
          TAG: ${{ steps.context.outputs.VERSION }}
        run: |
          set -euo pipefail

          if [[ "$TAG" == *-dev* ]] ||
             [[ "$TAG" == *-test* ]] ||
             [[ "$TAG" == *-stag* ]] ||
             [[ "$TAG" == *-rc* ]]; then
            echo "ERROR: Non-production tag cannot be deployed to production: $TAG"
            exit 1
          fi

          echo "Production guardrail passed: $TAG"

      - name: Download Exact Release Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.context.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Downloading release artifact for: $VERSION"

          gh release download "$VERSION" \
            --repo "$REPO" \
            --pattern "$ARTIFACT_NAME"

          gh release download "$VERSION" \
            --repo "$REPO" \
            --pattern "$CHECKSUM_NAME"

          if [[ ! -f "$ARTIFACT_NAME" ]]; then
            echo "ERROR: Required artifact not found:"
            echo "  $ARTIFACT_NAME"
            exit 1
          fi

          if [[ ! -f "$CHECKSUM_NAME" ]]; then
            echo "ERROR: Required checksum file not found:"
            echo "  $CHECKSUM_NAME"
            exit 1
          fi

          mv "$ARTIFACT_NAME" artifact.tar.gz
          mv "$CHECKSUM_NAME" artifact.tar.gz.sha256

      - name: Validate Checksum File
        run: |
          set -euo pipefail

          echo "Validating checksum file..."

          CHECKSUM="$(awk 'NF >= 1 {print $1; exit}' artifact.tar.gz.sha256)"

          if [[ ! "$CHECKSUM" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Invalid SHA256 checksum."
            exit 1
          fi

          echo "SHA256_HASH=$CHECKSUM" >> "$GITHUB_ENV"

      - name: Verify Artifact SHA256
        run: |
          set -euo pipefail

          echo "Verifying artifact checksum..."

          sha256sum -c artifact.tar.gz.sha256

          echo "Artifact SHA256 verification passed."

      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Securely Trust Remote Host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_HOST" ]]; then
            echo "ERROR: SSH_HOST secret is not configured."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          if [[ ! -s ~/.ssh/known_hosts ]]; then
            echo "ERROR: Failed to establish SSH host trust."
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Upload Artifact to Target Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail

          echo "Uploading verified artifact to remote host..."

          scp \
            artifact.tar.gz \
            "deploy@${SSH_HOST}:/home/deploy/artifact.tar.gz"

      - name: Execute Server Deployment Engine
        env:
          VERSION: ${{ steps.context.outputs.VERSION }}
          CHECKSUM: ${{ env.SHA256_HASH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          SYSTEMD_SERVICE: ${{ env.SYSTEMD_SERVICE }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
        run: |
          set -euo pipefail

          echo "Triggering remote deployment engine..."

          ssh "deploy@${SSH_HOST}" << EOF
            set -euo pipefail

            /opt/platform/deploy.sh \
              --service "${SERVICE_NAME}" \
              --version "${VERSION}" \
              --artifact "/home/deploy/artifact.tar.gz" \
              --sha256 "${CHECKSUM}" \
              --systemd "${SYSTEMD_SERVICE}" \
              --health "${HEALTH_URL}"

            rm -f /home/deploy/artifact.tar.gz
          EOF

      - name: Cleanup Runner Artifacts
        if: always()
        run: |
          rm -f \
            artifact.tar.gz \
            artifact.tar.gz.sha256
