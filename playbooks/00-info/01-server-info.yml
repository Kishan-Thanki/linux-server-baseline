---
# Read-only snapshot of what each server really is. Prints plain text to the
# terminal for copy and paste. Nothing is written to the servers or to disk.
# serial: 1 prints one server completely before the next, so the blocks do
# not interleave.
- name: Show live server information
  hosts: servers
  serial: 1
  gather_facts: true
  become: false
  roles:
    - server_info
