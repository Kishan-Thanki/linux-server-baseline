---
# Deletes the cloud image's default user (ubuntu) once Ansible runs as
# "automation". Deliberately NOT part of baseline.yml: it removes an access
# path, so run it only after confirming that automation and sysadmin work.
# serial: 1 changes one server at a time.
- name: Remove Cloud Provisioned User
  hosts: servers
  serial: 1
  become: true
  roles:
    - remove_default_user
