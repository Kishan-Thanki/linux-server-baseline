# =============================================================================
# Ansible configuration
# =============================================================================
# Run all commands from this directory so this file is picked up.
# =============================================================================

[defaults]
# --- Inventory ---------------------------------------------------------------
# Default inventory, so `-i` is not needed on every command.
inventory = inventory/inventory.ini

# --- Roles and collections ---------------------------------------------------
# Roles are split by purpose. Ansible searches these paths in order.
roles_path = ./roles

# Collections install into the project (see requirements.yml), not globally,
# so the setup is reproducible on any machine.
collections_path = ./.ansible/collections

# --- SSH behaviour -----------------------------------------------------------
# Verify server host keys. If a server is rebuilt, its key changes and Ansible
# will refuse to connect until you run: ssh-keygen -R <alias-or-ip>
host_key_checking = True

# Find Python 3 on the target automatically, without printing a warning.
interpreter_python = auto_silent

# --- Output ------------------------------------------------------------------
# Default callback with readable YAML task results instead of JSON blobs.
# Note: the key must be callback_result_format; plain result_format is ignored.
stdout_callback = default
callback_result_format = yaml

# Allow callbacks to run for the `ansible` ad-hoc command too.
bin_ansible_callbacks = True

[ssh_connection]
# Fewer SSH operations per task. Faster on these small servers, and safe
# because sudo does not require a TTY on Ubuntu.
pipelining = True
