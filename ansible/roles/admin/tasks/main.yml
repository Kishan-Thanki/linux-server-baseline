---
- name: Require administrator SSH public key file
  ansible.builtin.assert:
    that:
      - admin_ssh_public_key_file | length > 0
      - lookup('ansible.builtin.file', admin_ssh_public_key_file) | length > 0
    fail_msg: >-
      admin_ssh_public_key_file must point to a valid administrator
      SSH public key file on the Ansible controller.

- name: Create administrator account
  ansible.builtin.user:
    name: "{{ admin_user }}"
    home: "{{ admin_home }}"
    shell: "{{ admin_shell }}"
    create_home: true
    groups:
      - sudo
    append: true
    state: present

- name: Create administrator SSH directory
  ansible.builtin.file:
    path: "{{ admin_home }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: Install administrator SSH public key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ lookup('ansible.builtin.file', admin_ssh_public_key_file) }}"
    state: present
    manage_dir: false

- name: Configure administrator passwordless sudo
  ansible.builtin.template:
    src: sudoers.j2
    dest: "{{ admin_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Verify administrator account
  ansible.builtin.command:
    cmd: "id {{ admin_user }}"
  register: admin_id
  changed_when: false
  when: not ansible_check_mode

- name: Verify administrator group membership
  ansible.builtin.command:
    cmd: "id -nG {{ admin_user }}"
  register: admin_groups
  changed_when: false
  when: not ansible_check_mode

- name: Require administrator sudo membership
  ansible.builtin.assert:
    that:
      - "'sudo' in admin_groups.stdout.split()"
    fail_msg: >-
      Administrator {{ admin_user }} is not a member of the sudo group.
  when: not ansible_check_mode
