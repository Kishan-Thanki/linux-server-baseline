---
- name: Require target user
  ansible.builtin.assert:
    that:
      - provisioning_user | length > 0
    fail_msg: >-
      provisioning_user must be explicitly provided.

- name: Require explicit removal confirmation
  ansible.builtin.assert:
    that:
      - confirm_remove_provisioning_user | bool
    fail_msg: >-
      Set confirm_remove_provisioning_user=true to permit removal.

- name: Verify Ansible connection user
  ansible.builtin.assert:
    that:
      - ansible_user == remove_provisioning_user_automation_user
    fail_msg: >-
      This role must be executed through the Ansible automation account.
      Expected: {{ remove_provisioning_user_automation_user }}
      Actual: {{ ansible_user | default('undefined') }}

- name: Refuse to remove protected accounts
  ansible.builtin.assert:
    that:
      - provisioning_user not in remove_provisioning_user_protected_users
    fail_msg: >-
      Refusing to remove protected account {{ provisioning_user }}.

- name: Check whether target account exists
  ansible.builtin.command:
    cmd: "id {{ provisioning_user }}"
  register: remove_provisioning_user_account
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report target account already absent
  ansible.builtin.debug:
    msg: >-
      Provisioning user '{{ provisioning_user }}' is already absent.
      No removal is required.
  when: remove_provisioning_user_account.rc != 0

- name: Verify passwordless sudo
  ansible.builtin.command:
    cmd: sudo -n true
  changed_when: false
  when: remove_provisioning_user_account.rc == 0

- name: Get target account information
  ansible.builtin.getent:
    database: passwd
    key: "{{ provisioning_user }}"
  when: remove_provisioning_user_account.rc == 0

- name: Set target account facts
  ansible.builtin.set_fact:
    remove_provisioning_user_uid: >-
      {{ ansible_facts.getent_passwd[provisioning_user][1] | int }}
    remove_provisioning_user_home: >-
      {{ ansible_facts.getent_passwd[provisioning_user][4] }}
  when: remove_provisioning_user_account.rc == 0

- name: Refuse to remove system account
  ansible.builtin.assert:
    that:
      - remove_provisioning_user_uid >= remove_provisioning_user_min_uid
    fail_msg: >-
      Refusing to remove {{ provisioning_user }} because UID
      {{ remove_provisioning_user_uid }} is below the human-user threshold
      {{ remove_provisioning_user_min_uid }}.
  when: remove_provisioning_user_account.rc == 0

- name: Validate target home directory
  ansible.builtin.assert:
    that:
      - remove_provisioning_user_home | length > 0
      - remove_provisioning_user_home.startswith('/')
      - remove_provisioning_user_home not in ['/', '/home']
    fail_msg: >-
      Refusing to remove {{ provisioning_user }} because its home directory
      is unsafe: {{ remove_provisioning_user_home }}
  when: remove_provisioning_user_account.rc == 0

- name: Check target home directory
  ansible.builtin.stat:
    path: "{{ remove_provisioning_user_home }}"
  register: remove_provisioning_user_home_stat
  when: remove_provisioning_user_account.rc == 0

- name: Require target home directory
  ansible.builtin.assert:
    that:
      - remove_provisioning_user_home_stat.stat.exists
      - remove_provisioning_user_home_stat.stat.isdir
    fail_msg: >-
      Refusing to remove {{ provisioning_user }} because its home directory
      does not exist or is not a directory.
  when: remove_provisioning_user_account.rc == 0

- name: Check target home ownership
  ansible.builtin.assert:
    that:
      - remove_provisioning_user_home_stat.stat.uid | int == remove_provisioning_user_uid
    fail_msg: >-
      Refusing to remove {{ provisioning_user }} because its home directory
      is not owned by that user.
  when: remove_provisioning_user_account.rc == 0

- name: Check target user processes
  ansible.builtin.command:
    cmd: "pgrep -u {{ remove_provisioning_user_uid }}"
  register: remove_provisioning_user_processes
  changed_when: false
  failed_when: false
  check_mode: false
  when: remove_provisioning_user_account.rc == 0

- name: Refuse removal while processes are running
  ansible.builtin.assert:
    that:
      - remove_provisioning_user_processes.rc != 0
    fail_msg: >-
      Refusing to remove {{ provisioning_user }} because it still has
      running processes.
  when: remove_provisioning_user_account.rc == 0

- name: Remove provisioning user
  ansible.builtin.user:
    name: "{{ provisioning_user }}"
    state: absent
    remove: true
  when:
    - remove_provisioning_user_account.rc == 0
    - not ansible_check_mode

- name: Verify provisioning user was removed
  ansible.builtin.command:
    cmd: "id {{ provisioning_user }}"
  register: remove_provisioning_user_verify
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - remove_provisioning_user_account.rc == 0
    - not ansible_check_mode

- name: Require provisioning user to be absent
  ansible.builtin.assert:
    that:
      - remove_provisioning_user_verify.rc != 0
    fail_msg: >-
      Provisioning user {{ provisioning_user }} still exists.
  when:
    - remove_provisioning_user_account.rc == 0
    - not ansible_check_mode
