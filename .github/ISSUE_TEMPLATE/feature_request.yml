name: Feature Request
description: Suggest an improvement, new security control, role, or educational enhancement for the server baseline.
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Clearly describe what you would like to add or change.
      placeholder: |
        Add a reusable role for configuring log rotation.
    validations:
      required: true

  - type: textarea
    id: problem_context
    attributes:
      label: Problem Statement / Context
      description: What problem does this solve, who would benefit from it, and why does it fit the scope of this project?
      placeholder: |
        Application logs may grow indefinitely and consume disk space.
        A simple log rotation role would provide a useful operational
        capability for small Ubuntu servers.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Implementation
      description: Optional. Describe a possible implementation, including roles, variables, Ansible modules, or configuration files.
      placeholder: |
        Create a `logrotate` role with:
        - defaults/main.yml
        - tasks/main.yml
        - a configuration template
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Optional. Describe any alternative approach or existing project feature that you considered.
      placeholder: |
        Considered configuring logrotate directly in the existing journald role,
        but a separate role seems more modular.
    validations:
      required: false

  - type: checkboxes
    id: scope_check
    attributes:
      label: Project Scope
      description: Please confirm that the proposed feature fits the project's intended scope.
      options:
        - label: This feature is relevant to Ubuntu server administration.
        - label: This feature is reasonably useful for the project's educational or small-server use case.
        - label: This feature does not require making the baseline a full enterprise or compliance framework.
