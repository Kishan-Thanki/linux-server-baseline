name: Feature Request
description: Suggest an enhancement, new security rule, or additional role for the server baseline.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want to add or change.
      placeholder: e.g., Add a new role for configuring log rotation, or add support for a new firewall backend.
    validations:
      required: true
  - type: textarea
    id: problem_context
    attributes:
      label: Problem Statement / Context
      description: What problem does this feature solve? Why is it beneficial for this server baseline?
      placeholder: e.g., Without logrotate adjustments, application logs under /var/log can grow indefinitely and consume disk space.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Implementation (Optional)
      description: How would you implement this? Any specific Ansible modules, variables, or task structures in mind?
      placeholder: e.g., Create a new role `logrotate` with a default variables file and a template for configuration.
    validations:
      required: false
