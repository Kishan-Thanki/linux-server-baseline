name: Bug Report
description: Report an unexpected failure or incorrect behavior in a playbook or role.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description of the Issue
      description: Describe what happened, what you expected to happen, and what actually happened.
      placeholder: |
        The baseline failed while configuring Fail2ban.
        I expected the role to complete successfully, but the task failed with...
    validations:
      required: true

  - type: input
    id: playbook_role
    attributes:
      label: Playbook or Role
      description: Identify the playbook or role that failed.
      placeholder: playbooks/01-setup/06-fail2ban.yml
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Target Ubuntu Version
      description: Provide the Ubuntu version running on the target server.
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: ansible_version
    attributes:
      label: Ansible Version
      description: Provide the Ansible version used to run the playbook.
      placeholder: ansible [core 2.x.x]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Traceback
      description: Paste the relevant Ansible output. Remove secrets, private keys, tokens, and other sensitive information.
      render: shell
      placeholder: |
        TASK [fail2ban : Deploy Fail2ban jail configuration] ***********************
        fatal: [server-01]: FAILED! => ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the commands or steps needed to reproduce the issue.
      placeholder: |
        1. Configure inventory...
        2. Run ansible-playbook...
        3. Failure occurs at...
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Include relevant configuration, custom variables, or anything else that may help reproduce the issue.
      placeholder: |
        Custom firewall_allowed_ports:
          - "22/tcp"
          - "8080/tcp"
