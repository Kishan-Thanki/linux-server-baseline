---
# Creates the admin user, installs its SSH key, and grants passwordless sudo.
#
# Bootstrap (server has only a default user such as "ubuntu"):
#   ansible-playbook <playbook> -e ansible_user=ubuntu
# because the automation user does not exist yet to connect as.
#
# Requires supported_os_distribution (shared variable from group_vars).

- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in supported_os_distribution
    fail_msg: >-
      This automation_user role supports
      {{ supported_os_distribution | join(', ') }} only.

# Fail before touching the server if the key is missing or empty.
# This also protects the exclusive key task below from wiping keys.
- name: Validate required automation user SSH key configuration
  ansible.builtin.assert:
    that:
      - automation_user_ssh_public_key_file | length > 0
      - lookup('ansible.builtin.file', automation_user_ssh_public_key_file, errors='ignore') | length > 0
    fail_msg: "automation_user_ssh_public_key_file must point to a valid automation public key file."

- name: Ensure sudo group exists
  ansible.builtin.group:
    name: "{{ automation_user_sudo_group }}"
    state: present

# password_lock disables password login. The account is key-only.
- name: Create or update automation user
  ansible.builtin.user:
    name: "{{ automation_user_name }}"
    shell: "{{ automation_user_shell }}"
    create_home: true
    groups:
      - "{{ automation_user_sudo_group }}"
    append: true
    password_lock: true
    state: present

# exclusive removes any other key from authorized_keys, so a rotated or
# leaked old key stops working on the next run.
# WARNING: this key must be the one Ansible connects with. If the file
# points at a different key, the next run cannot log in.
- name: Add dedicated SSH authorized key for automation user
  ansible.posix.authorized_key:
    user: "{{ automation_user_name }}"
    key: "{{ lookup('ansible.builtin.file', automation_user_ssh_public_key_file) }}"
    state: present
    exclusive: true

# validate runs visudo on a temp file first, so a typo cannot break sudo.
- name: Configure passwordless sudo for automation user
  ansible.builtin.template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ automation_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
