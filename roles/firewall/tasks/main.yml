---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
    fail_msg: "This firewall role supports Ubuntu only."

- name: Ensure firewalld package is installed
  ansible.builtin.apt:
    name: firewalld
    state: present
    update_cache: true

- name: Ensure firewalld service is enabled and started
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Configure allowed ports in the default zone
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
    zone: "{{ firewall_default_zone }}"
  loop: "{{ firewall_allowed_ports }}"
