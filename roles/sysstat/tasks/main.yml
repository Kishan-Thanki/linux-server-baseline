---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
    fail_msg: "This sysstat role supports Ubuntu only."

- name: Ensure sysstat package is installed
  ansible.builtin.apt:
    name: sysstat
    state: present
    update_cache: true

- name: Enable sysstat data collection
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: "^ENABLED="
    line: 'ENABLED="true"'
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Configure sysstat history retention
  ansible.builtin.lineinfile:
    path: /etc/sysstat/sysstat
    regexp: "^HISTORY="
    line: "HISTORY={{ sysstat_history_days }}"
    owner: root
    group: root
    mode: "0644"
