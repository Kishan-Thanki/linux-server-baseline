---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in supported_os_distribution
    fail_msg: >-
      This system_update role supports
      {{ supported_os_distribution | join(', ') }} only.

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist
    autoclean: true
    fail_on_autoremove: true

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: system_update_reboot_required_file

- name: Reboot the server if required
  ansible.builtin.reboot:
    msg: "Ansible triggered a reboot due to system updates."
    pre_reboot_delay: 2
    post_reboot_delay: 10
    connect_timeout: 5
    reboot_timeout: "{{ system_update_reboot_timeout }}"
  when:
    - system_update_reboot_required_file.stat.exists
    - system_update_reboot
