---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in supported_os_distribution
    fail_msg: >-
      This swap role supports
      {{ supported_os_distribution | join(', ') }} only.

- name: Check current swap status
  ansible.builtin.command:
    cmd: swapon --show --noheadings
  register: swap_status
  changed_when: false
  check_mode: false

- name: Check configured swap file
  ansible.builtin.stat:
    path: "{{ swap_file }}"
  register: swap_file_status
  when: swap_enabled

- name: Create swap file when missing
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size_mb }}M {{ swap_file }}"
    creates: "{{ swap_file }}"
  when:
    - swap_enabled
    - not swap_file_status.stat.exists

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"
  when: swap_enabled

- name: Check swap file signature
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ swap_file }}"
  register: swap_file_type
  changed_when: false
  failed_when: false
  check_mode: false
  when: swap_enabled

- name: Create swap signature when missing
  ansible.builtin.command:
    cmd: "mkswap {{ swap_file }}"
  when:
    - swap_enabled
    - swap_file_type.stdout | default('') != "swap"
  changed_when: true

- name: Persist swap in /etc/fstab
  ansible.posix.mount:
    path: none
    src: "{{ swap_file }}"
    fstype: swap
    opts: defaults
    dump: "0"
    passno: "0"
    state: present
  when: swap_enabled

- name: Activate swap
  ansible.builtin.command:
    cmd: "swapon {{ swap_file }}"
  when:
    - swap_enabled
    - swap_file not in (swap_status.stdout_lines | map('split') | map('first') | list)
    - not ansible_check_mode
  changed_when: true

- name: Verify active swap
  ansible.builtin.command:
    cmd: swapon --show
  register: swap_verification
  changed_when: false
  check_mode: false

- name: Display active swap
  ansible.builtin.debug:
    var: swap_verification.stdout_lines
