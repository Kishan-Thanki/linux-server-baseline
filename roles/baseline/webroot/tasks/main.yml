---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in supported_os_distribution
    fail_msg: >-
      This webroot role supports
      {{ supported_os_distribution | join(', ') }} only.

- name: Create web root directory
  ansible.builtin.file:
    path: "{{ webroot_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create default web page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webroot_path }}/{{ webroot_index_file }}"
    owner: root
    group: root
    mode: "0644"
