---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in supported_os_distribution
    fail_msg: >-
      This firewall role supports
      {{ supported_os_distribution | join(', ') }} only.

- name: Ensure firewalld package is installed
  ansible.builtin.apt:
    name: firewalld
    state: present
    update_cache: true

- name: Stop and disable netfilter-persistent
  ansible.builtin.systemd:
    name: netfilter-persistent
    state: stopped
    enabled: false
  failed_when: false

- name: Ensure firewalld service is enabled and started
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Configure allowed ports in the default zone
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
    zone: "{{ firewall_zone }}"
  loop: "{{ firewall_allowed_ports }}"
