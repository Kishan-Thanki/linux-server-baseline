---
deployment_engine_version: "1.0.0"

deployment_engine_path: "/usr/local/bin/deploy"

deployment_engine_owner: "root"

deployment_engine_group: "root"

deployment_engine_mode: "0755"

deployment_engine_base: "/opt/app"

deployment_engine_lock_name: ".deploy.lock"

deployment_engine_log_name: ".deployments.log"

deployment_engine_temp_root: "/tmp"

deployment_engine_max_artifact_size_mb: 5120

deployment_engine_max_extracted_size_mb: 10240

deployment_engine_max_file_count: 50000

deployment_engine_keep_releases: 3

deployment_engine_download_timeout_seconds: 300

deployment_engine_download_connect_timeout_seconds: 15
