---
# Written to /etc/sysctl.d/99-security.conf. Ubuntu's own 10-*.conf files
# load first, so these values win.
#
# Trade-offs to know about:
#   rp_filter 1 is strict mode (Ubuntu's default is loose, 2). Fine on a
#     single network interface. Revisit it if you add Tailscale, WireGuard
#     or other routing, which can need 2.
#   log_martians 1 logs packets with impossible source addresses. On an
#     internet-facing server this can be noisy; journald's size caps keep
#     it bounded.
sysctl_settings:
  # TCP SYN flood protection
  net.ipv4.tcp_syncookies: 1

  # Reverse path filtering
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1

  # Disable IPv4 ICMP redirects
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0

  # Disable secure IPv4 ICMP redirects
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0

  # Do not send IPv4 ICMP redirects
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0

  # Disable IPv6 ICMP redirects
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0

  # Disable IPv4 source routing
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0

  # Disable IPv6 source routing
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0

  # Log suspicious source addresses
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1

  # Ignore ICMP echo requests to broadcast addresses
  net.ipv4.icmp_echo_ignore_broadcasts: 1

  # Ignore bogus ICMP error responses
  net.ipv4.icmp_ignore_bogus_error_responses: 1
