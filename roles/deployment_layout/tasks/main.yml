---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
    fail_msg: "This deployment_layout role supports Ubuntu only."

- name: Validate deployment owner exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ deployment_layout_owner }}"

- name: Validate deployment group exists
  ansible.builtin.getent:
    database: group
    key: "{{ deployment_layout_group }}"

- name: Validate deployment root path
  ansible.builtin.assert:
    that:
      - deployment_layout_root == "/opt/app"
    fail_msg: >-
      deployment_layout_root must remain /opt/app.
      The deployment role owns only the dedicated deployment boundary.

- name: Create deployment root directory
  ansible.builtin.file:
    path: "{{ deployment_layout_root }}"
    state: directory
    owner: "{{ deployment_layout_owner }}"
    group: "{{ deployment_layout_group }}"
    mode: "{{ deployment_layout_directory_mode }}"
