---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
    fail_msg: "This auditd role supports Ubuntu only."

- name: Ensure auditd package is installed
  ansible.builtin.apt:
    name: auditd
    state: present
    update_cache: true

- name: Ensure audit rules directory exists
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy custom audit rules
  ansible.builtin.template:
    src: 99-custom.rules.j2
    dest: /etc/audit/rules.d/99-custom.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load audit rules

- name: Validate audit rules
  ansible.builtin.command:
    cmd: augenrules --check
  changed_when: false
  check_mode: false

- name: Ensure auditd service is enabled and started
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
