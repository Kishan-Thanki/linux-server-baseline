---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
    fail_msg: "This swap role supports Ubuntu only."

- name: Check current swap status
  ansible.builtin.command:
    cmd: swapon --show --noheadings
  register: swap_status
  changed_when: false
  check_mode: false

- name: Check configured swap file
  ansible.builtin.stat:
    path: "{{ swap_file }}"
  register: swap_file_status
  when: swap_enabled

- name: Create swap file when missing
  community.general.filesize:
    path: "{{ swap_file }}"
    size: "{{ swap_size_mb }}M"
    owner: root
    group: root
    mode: "0600"
  when:
    - swap_enabled
    - not swap_file_status.stat.exists

- name: Ensure swap signature exists
  community.general.filesystem:
    dev: "{{ swap_file }}"
    fstype: swap
    state: present
  when:
    - swap_enabled

- name: Persist swap in /etc/fstab
  ansible.posix.mount:
    path: none
    src: "{{ swap_file }}"
    fstype: swap
    opts: defaults
    dump: "0"
    passno: "0"
    state: present
  when:
    - swap_enabled

- name: Activate swap
  ansible.builtin.command:
    cmd: "swapon {{ swap_file }}"
  when:
    - swap_enabled
    - swap_file not in (swap_status.stdout_lines | map('split') | map('first') | list)
    - not ansible_check_mode
  changed_when: true

- name: Verify active swap
  ansible.builtin.command:
    cmd: swapon --show
  register: swap_verification
  changed_when: false
  check_mode: false

- name: Display active swap
  ansible.builtin.debug:
    var: swap_verification.stdout_lines
