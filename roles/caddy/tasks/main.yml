---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in supported_os_distribution
    fail_msg: >-
      This caddy role supports
      {{ supported_os_distribution | join(', ') }} only.

- name: Ensure Caddy and inotify-tools are installed
  ansible.builtin.apt:
    name:
      - "{{ caddy_package_name }}"
      - "{{ caddy_inotify_package }}"
    state: present
    update_cache: true

- name: Ensure Caddy configuration directory exists
  ansible.builtin.file:
    path: "{{ caddy_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Caddy drop-in directory exists
  ansible.builtin.file:
    path: "{{ caddy_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy main Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: Reload Caddy

- name: Deploy Caddy reload script
  ansible.builtin.template:
    src: caddy-reload.sh.j2
    dest: "/usr/local/sbin/caddy-reload"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Caddy watcher

- name: Deploy Caddy reload service
  ansible.builtin.template:
    src: caddy-reload.service.j2
    dest: "/etc/systemd/system/{{ caddy_reload_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart Caddy watcher

- name: Deploy Caddy watcher script
  ansible.builtin.template:
    src: caddy-watch.sh.j2
    dest: "/usr/local/sbin/caddy-watch"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Caddy watcher

- name: Deploy Caddy watcher service
  ansible.builtin.template:
    src: caddy-watch.service.j2
    dest: "/etc/systemd/system/{{ caddy_watch_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart Caddy watcher

- name: Ensure Caddy is enabled and running
  ansible.builtin.systemd:
    name: "{{ caddy_service_name }}"
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Ensure Caddy watcher is enabled and running
  ansible.builtin.systemd:
    name: "{{ caddy_watch_service_name }}"
    enabled: true
    state: started
  when: not ansible_check_mode
