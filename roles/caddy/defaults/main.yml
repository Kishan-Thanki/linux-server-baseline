---
caddy_package_name: "caddy"
caddy_inotify_package: "inotify-tools"

caddy_config_dir: "/etc/caddy"
caddy_dropin_dir: "/etc/caddy/Caddyfile.d"
caddy_dropin_extension: "caddyfile"
caddy_config_file: "/etc/caddy/Caddyfile"

caddy_service_name: "caddy"
caddy_reload_service_name: "caddy-reload"
caddy_watch_service_name: "caddy-watch"

caddy_reload_debounce_seconds: 5
