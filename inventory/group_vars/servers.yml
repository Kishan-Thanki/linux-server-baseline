---
# Supported Linux distributions for this baseline.
# Add more entries only when the playbooks have been validated for that OS.
supported_os_distribution:
  - Ubuntu

# SSH users explicitly allowed to access managed servers.
# Keep this list in sync whenever a user is added to or removed from SSH access.
# This is the source of truth for the ssh_hardening_allow_users variable.
ssh_hardening_allow_users:
  - "{{ ansible_user }}"
  - sysadmin
  - automation
  - deployer

# Users that must be preserved when the default user is removed.
# These accounts are exempt from deletion and must remain available.
remove_default_user_protected_users:
  - "sysadmin"
  - "automation"
  - "deployer"
