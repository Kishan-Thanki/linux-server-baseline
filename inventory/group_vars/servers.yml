---
# Only Ubuntu is supported by these roles.
supported_os_distribution:
  - Ubuntu

# Users allowed to log in over SSH (written to AllowUsers by the sshd role).
# List names explicitly so the list does not change with ansible_user.
# Never remove "automation": it is the account Ansible connects as.
ssh_hardening_allow_users:
  - "{{ ansible_user }}"
  - automation
  - sysadmin

# Users the "remove default user" role must never delete.
remove_default_user_protected_users:
  - "{{ ansible_user }}"
  - automation
  - sysadmin

system_admin_ssh_public_key_file: ""
automation_user_ssh_public_key_file: ""
