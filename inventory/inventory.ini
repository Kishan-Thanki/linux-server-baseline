# Configure this inventory for your environment.
#
# ==============================================================================
# IMPORTANT: THE ANSIBLE USER LIFECYCLE
# ==============================================================================
# Step 1 (Bootstrap): For a brand new server, set 'ansible_user' below to your 
# cloud provider's default user (e.g., ubuntu, root, ec2-user, debian). 
# Run the baseline.yml playbook.
#
# Step 2 (Ongoing): Once the baseline finishes and creates your new accounts, 
# change 'ansible_user' below to 'automation'. Verify you can connect.
#
# Step 3 (Cleanup): Run the 99-remove-default-user.yml playbook to securely 
# delete the original cloud provider user.
# ==============================================================================
#
# [servers] is an Ansible inventory group.
# You can define one or multiple servers in a group.
# Add or remove server entries as needed.
#
# You can also create additional groups for different
# server types or environments, for example:
#
# [web]
# web-01 ansible_host=YOUR_SERVER_HOSTNAME ansible_user=YOUR_ANSIBLE_USER
#
# [database]
# db-01 ansible_host=YOUR_SERVER_HOSTNAME ansible_user=YOUR_ANSIBLE_USER
#
# Replace the placeholder values below with your actual
# server hostname/IP address and Ansible SSH user.

[servers]

server-01 ansible_host=YOUR_SERVER_HOSTNAME ansible_user=YOUR_ANSIBLE_USER
server-02 ansible_host=YOUR_SERVER_HOSTNAME ansible_user=YOUR_ANSIBLE_USER
