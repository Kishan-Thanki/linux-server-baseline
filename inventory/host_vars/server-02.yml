---
# ==============================================================================
# SSH PUBLIC KEY FILES
#
# Provide paths to your public SSH key files on the Ansible control machine
# before running the baseline.
#
# The variables below expect file paths, not the SSH public-key contents.
#
# Example:
# system_admin_ssh_public_key_file: "/home/YOUR_USER/.ssh/id_ed25519.pub"
#
# The corresponding .pub files must exist and be readable by Ansible.
# ==============================================================================

# Public key file for the human administrator ('sysadmin').
system_admin_ssh_public_key_file: ""

# Public key file for automated tools ('automation').
automation_user_ssh_public_key_file: ""
